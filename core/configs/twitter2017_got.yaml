# GOT：语义 OT + GW 结构项（训练入口为 argparse，本文件作文档）
# 与 twitter2017_sem_ot.yaml 对齐；结构消融见 got_struct_mode

use_semantic_ot: false
use_got: true
ot_alpha: 0.05
ot_eps: 0.1
ot_sinkhorn_iter: 10
ot_lambda_align: 1.0
got_lambda_sem: 0.5
struct_mode: "full"   # CLI: --got_struct_mode full|identity|ones

# MTC / SCL：加强 MISC 与 ORG、LOC 的负样本对比（关闭则与原版 SCL 一致）
# use_misc_weighted_scl: false
# scl_misc_neg_weight: 2.0

